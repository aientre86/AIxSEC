  <line x1="50" y1="38" x2="66" y2="56" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="2 1" />
  <line x1="34" y1="56" x2="50" y2="72" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="2 1" />
  <line x1="66" y1="56" x2="50" y2="72" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="2 1" />
  <line x1="50" y1="38" x2="50" y2="72" stroke="#60a5fa" stroke-width="2" />
