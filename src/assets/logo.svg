  <circle cx="50" cy="38" r="6" fill="url(#coreGrad)" />
  <circle cx="34" cy="56" r="4.5" fill="#38bdf8" />
  <circle cx="66" cy="56" r="4.5" fill="#38bdf8" />
  <circle cx="50" cy="72" r="5" fill="#818cf8" />
  
